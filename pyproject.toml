[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cqrlib"
version = "0.1.0"
description = "CQR Library - Quantitative Research Library for financial machine learning"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.17.3",
    "pandas>=1.0.3",
    "scipy>=1.3.1",
    "scikit-learn>=0.23.1",
    "matplotlib>=3.1.1",
    "statsmodels>=0.11.1",
    "numba>=0.49.1",
    "cvxpy>=1.0.0",
]

[project.urls]
Home = "https://github.com/quant-research/cqrlib"
